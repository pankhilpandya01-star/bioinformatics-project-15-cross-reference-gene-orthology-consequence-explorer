[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "comparative-gene-explorer"
version = "0.1.0"
description = "Cross-reference gene orthology and consequence comparison workflow"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["matplotlib==3.11.1"]
keywords = ["bioinformatics", "orthology", "variant-annotation", "callability"]

[project.scripts]
comparative-gene-explorer = "comparative_gene_explorer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

