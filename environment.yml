name: comparative-gene-explorer
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - orthofinder=3.1.5
  - snpeff=5.4.0c
  - bcftools=1.24
  - ncbi-datasets-cli=18.36.0
  - matplotlib=3.11.1
  # SnpEff 5.4.0c's Bioconda package requires OpenJDK 21 or newer.
  - openjdk=21
  - pip

